name: Daily model price check

on:
  schedule:
    # 每天 03:17 UTC（约北京 11:17）检查一次模型价格
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查价格差异（dry-run）
        run: node scripts/update-prices.mjs

      - name: 应用更新并部署（仅在仓库已配置 Cloudflare 密钥时）
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if node scripts/update-prices.mjs | grep -q '有更新'; then
            node scripts/update-prices.mjs --apply
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add src/data/models.json
            git commit -m "chore: 同步模型价格 $(date +%F)" || true
            npm ci
            npm run build
            npx wrangler pages deploy dist --project-name relay-cache-calculator --branch main --commit-dirty=true --commit-message "chore: 每日价格同步 $(date +%F)"
            git push
          else
            echo "价格无变化，跳过部署"
          fi
